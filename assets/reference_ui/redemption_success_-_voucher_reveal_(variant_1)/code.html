<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Redemption Success - Sharma Store</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00c298",
                        "background-light": "#f5f8f8",
                        "background-dark": "#0f231f",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "3xl": "2.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .frosted-paper {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            background-image: radial-gradient(#10181710 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .dark .frosted-paper {
            background: rgba(15, 35, 31, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-image: radial-gradient(#ffffff10 1px, transparent 1px);
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#101817] dark:text-white transition-colors duration-300">
<!-- Base Page Mockup (Blurred Background) -->
<div class="relative min-h-screen w-full overflow-hidden blur-md opacity-40">
<div class="layout-container flex flex-col">
<header class="flex items-center justify-between px-10 py-5 border-b border-gray-200 dark:border-gray-800">
<div class="flex items-center gap-8">
<div class="flex items-center gap-4 text-[#101817] dark:text-white">
<span class="material-symbols-outlined text-3xl text-primary">shopping_bag</span>
<h2 class="text-xl font-bold tracking-tight">Sharma Store</h2>
</div>
<div class="h-10 w-64 bg-gray-200 dark:bg-gray-700 rounded-xl"></div>
</div>
<div class="flex gap-6">
<div class="w-20 h-4 bg-gray-200 dark:bg-gray-700 rounded"></div>
<div class="w-20 h-4 bg-gray-200 dark:bg-gray-700 rounded"></div>
<div class="w-20 h-4 bg-gray-200 dark:bg-gray-700 rounded"></div>
</div>
</header>
<main class="p-20 grid grid-cols-3 gap-8">
<div class="aspect-square bg-gray-200 dark:bg-gray-700 rounded-2xl"></div>
<div class="aspect-square bg-gray-200 dark:bg-gray-700 rounded-2xl"></div>
<div class="aspect-square bg-gray-200 dark:bg-gray-700 rounded-2xl"></div>
</main>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/10 dark:bg-black/40 backdrop-blur-sm">
<!-- Confetti Elements (Abstract visual representation) -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="confetti bg-orange-400 top-1/4 left-1/3 rotate-12"></div>
<div class="confetti bg-primary top-1/3 right-1/4 -rotate-45"></div>
<div class="confetti bg-blue-400 bottom-1/4 left-1/4 rotate-90"></div>
<div class="confetti bg-yellow-400 top-1/2 right-1/3 rotate-12"></div>
<div class="confetti bg-pink-400 top-1/4 right-1/2 -rotate-12"></div>
<div class="confetti bg-primary bottom-1/3 left-1/2 rotate-45"></div>
</div>
<!-- Redemption Success Modal -->
<div class="frosted-paper relative w-full max-w-[560px] rounded-3xl p-10 shadow-2xl flex flex-col items-center text-center">
<!-- Success Icon -->
<div class="relative mb-8">
<div class="absolute inset-0 bg-primary/20 blur-2xl rounded-full"></div>
<div class="relative bg-primary w-24 h-24 rounded-full flex items-center justify-center shadow-lg shadow-primary/40 transform -rotate-3 hover:rotate-0 transition-transform cursor-default">
<span class="material-symbols-outlined text-white text-5xl leading-none">check_circle</span>
</div>
</div>
<!-- Headline -->
<h1 class="text-4xl font-extrabold tracking-tight text-[#101817] dark:text-white mb-2">Reward Unlocked!</h1>
<p class="text-[#101817]/70 dark:text-white/70 text-lg mb-10 max-w-sm">Your points have been successfully redeemed. Enjoy your discount!</p>
<!-- Voucher Card (Frosted Paper Variant) -->
<div class="w-full bg-white/40 dark:bg-white/5 border-2 border-dashed border-primary/40 dark:border-primary/60 rounded-2xl p-8 mb-8 relative group overflow-hidden">
<div class="absolute top-0 left-0 w-8 h-8 bg-background-light dark:bg-background-dark -ml-4 -mt-4 rounded-full border border-dashed border-primary/40"></div>
<div class="absolute top-0 right-0 w-8 h-8 bg-background-light dark:bg-background-dark -mr-4 -mt-4 rounded-full border border-dashed border-primary/40"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 bg-background-light dark:bg-background-dark -ml-4 -mb-4 rounded-full border border-dashed border-primary/40"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 bg-background-light dark:bg-background-dark -mr-4 -mb-4 rounded-full border border-dashed border-primary/40"></div>
<p class="text-xs uppercase tracking-[0.2em] font-bold text-primary mb-3">Voucher Code</p>
<div class="flex items-center justify-center gap-6">
<span class="text-5xl font-black tracking-widest text-[#101817] dark:text-white" style="font-family: 'Courier New', Courier, monospace;">SHARMA50</span>
<button class="flex items-center justify-center w-12 h-12 rounded-xl bg-white dark:bg-white/10 text-primary border border-primary/20 hover:bg-primary hover:text-white transition-all duration-200 group-hover:scale-110 active:scale-95 shadow-sm">
<span class="material-symbols-outlined">content_copy</span>
</button>
</div>
<div class="mt-6 pt-6 border-t border-primary/10 flex justify-between items-center">
<p class="text-sm font-medium text-[#101817]/60 dark:text-white/60">50% Off Everything</p>
<p class="text-xs text-[#101817]/40 dark:text-white/40">Expires in 30 days</p>
</div>
</div>
<!-- Stats Balance -->
<div class="flex items-center gap-3 bg-primary/10 dark:bg-primary/20 px-6 py-3 rounded-full border border-primary/10 mb-10">
<span class="material-symbols-outlined text-primary text-xl">payments</span>
<p class="text-base font-semibold text-primary">New Balance: <span class="text-[#101817] dark:text-white">1,250 Sharma Coins</span></p>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-4">
<button class="w-full py-5 bg-primary hover:bg-primary/90 text-white text-lg font-bold rounded-2xl shadow-xl shadow-primary/20 transform transition-all active:scale-[0.98]">
                    Apply to Cart
                </button>
<button class="w-full py-4 bg-transparent text-[#101817]/60 dark:text-white/60 text-base font-medium hover:text-primary transition-colors">
                    Continue Shopping
                </button>
</div>
<!-- Notebook Aesthetic Detail -->
<div class="absolute bottom-6 left-0 right-0 flex justify-center gap-2 pointer-events-none opacity-20">
<div class="w-1.5 h-1.5 rounded-full bg-black/40 dark:bg-white/40"></div>
<div class="w-1.5 h-1.5 rounded-full bg-black/40 dark:bg-white/40"></div>
<div class="w-1.5 h-1.5 rounded-full bg-black/40 dark:bg-white/40"></div>
</div>
</div>
</div>
</body></html>
